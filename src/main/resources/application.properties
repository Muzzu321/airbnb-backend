spring.application.name=airBnbApp

# ---------------------------------------------------------------------------
# All environment-specific values and ALL secrets come from environment
# variables. Nothing secret is committed. See .env.example for the full list.
# ---------------------------------------------------------------------------

# Database (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/airBnb}
spring.datasource.username=${DB_USERNAME:airbnb_user}
spring.datasource.password=${DB_PASSWORD}

# JPA. The project has no Flyway/Liquibase migrations; the schema is created and
# updated by Hibernate. For production use "validate" (or add real migrations).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api/v1

# JWT signing key: required, minimum 32 characters (256 bits) for HS256
jwt.secretKey=${JWT_SECRET}

# Public URL of the React app. Used for Stripe success/cancel redirects.
frontend.url=${FRONTEND_URL:http://localhost:5173}

# CORS: comma-separated list of exact origins that may call the API from a browser.
# Never use "*" together with credentials. Set this to your real domain in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}

# Refresh-token cookie. For production behind HTTPS set COOKIE_SECURE=true.
# If the frontend and API are on different *sites* use COOKIE_SAME_SITE=None (requires Secure).
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Stripe (test mode keys while developing)
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
